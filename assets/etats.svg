<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 712 66" width="712" height="66" role="img" aria-label="Les six états de session : Autorisation, Erreur, En cours, Démarrage, Inactif, Terminé">
  <!-- Couleurs et formes de la direction artistique : un état se lit par couleur + forme + libellé. -->
  <g font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600" text-anchor="middle">

    <!-- waiting_permission : seul à porter l'or, bordure or comme la vignette -->
    <rect x="0.75" y="0.75" width="110.5" height="64.5" rx="12" fill="#26221A" stroke="#F6B12A" stroke-width="1.5"/>
    <path d="M 56 18 L 64 26 L 56 34 L 48 26 Z" fill="#F6B12A"/>
    <text x="56" y="54" fill="#F6B12A">Autorisation</text>

    <!-- error -->
    <rect x="120.75" y="0.75" width="110.5" height="64.5" rx="12" fill="#211F1A" stroke="#38352C" stroke-width="1.5"/>
    <path d="M 176 18 L 185 33 L 167 33 Z" fill="#EA5B54"/>
    <text x="176" y="54" fill="#EA5B54">Erreur</text>

    <!-- running -->
    <rect x="240.75" y="0.75" width="110.5" height="64.5" rx="12" fill="#211F1A" stroke="#38352C" stroke-width="1.5"/>
    <circle cx="296" cy="26" r="7.5" fill="#45BCC2"/>
    <text x="296" y="54" fill="#45BCC2">En cours</text>

    <!-- starting : l'anneau qui tourne -->
    <rect x="360.75" y="0.75" width="110.5" height="64.5" rx="12" fill="#211F1A" stroke="#38352C" stroke-width="1.5"/>
    <circle cx="416" cy="26" r="7" fill="none" stroke="#86A2D6" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="33 11"/>
    <text x="416" y="54" fill="#86A2D6">Démarrage</text>

    <!-- idle -->
    <rect x="480.75" y="0.75" width="110.5" height="64.5" rx="12" fill="#211F1A" stroke="#38352C" stroke-width="1.5"/>
    <circle cx="536" cy="26" r="7" fill="none" stroke="#928C7C" stroke-width="2.5"/>
    <text x="536" y="54" fill="#928C7C">Inactif</text>

    <!-- ended -->
    <rect x="600.75" y="0.75" width="110.5" height="64.5" rx="12" fill="#211F1A" stroke="#38352C" stroke-width="1.5"/>
    <path d="M 650 26 L 654.5 31 L 663 20" fill="none" stroke="#6FA98C" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="656" y="54" fill="#6FA98C">Terminé</text>

  </g>
</svg>
